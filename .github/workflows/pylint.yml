# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Install and lint

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: get python version
      id: python_version
      run: echo PYTHON_VERS=$(cat metenv.yml | grep python= | sed 's/.*python=\([0-9]\.[0-9]*\.[0-9]*\).*/\1/') >> $GITHUB_OUTPUT

    - name: Set up Python ${{ steps.python_version.outputs.PYTHON_VERS }}
      uses: actions/setup-python@v3
      with:
        python-version: "${{ steps.python_version.outputs.PYTHON_VERS }}"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements_lint.txt

    - name: Lint
      run: |
        ./lint.sh .

output_folder: ./isonreal72/ # name of the parent folder where all experiments will be stored
experiments: #list of experiments
  - name: Experiment1 # the name is a unique identifier to each experiment
    dataloaders: # defining the sources of data (datasets), their sampling logic and the preprocessing
      type: DateDataloader # the type defines the loading logic. DateDataloader separates data into distinct timestamps.
      batch_size: 1
      maxNsamples: 16384
      path_to_csv: /project/home/p200177/DE_371/datasets/dataset_Meteo_France_rr_u_v_t2m/data/IS_rr_debug_1_1.0_0_0_0_0_0_256_large_lt #where to find the csv file linking files to metadata. Files not registered in this csv will not be used.
      csv_file: updated_file1_valid.csv # the csv file. An example structure is shown in example_labels.csv
      date_start: '2020-06-22' # defining the period in which data is fetched 
      date_end: '2020-12-05'
      number_of_dates : 150
      Lead_Times : 15
      start_time : 21 # 21:00. Arome simulations in the dataset start at 21:00 
      dh : 3 
      real_dataset_config:
        data_folder: /project/home/p200177/DE_371/datasets/dataset_Meteo_France_rr_u_v_t2m/data/IS_rr_debug_1_1.0_0_0_0_0_0_256_large_lt
        variables: ['rr','u','v','t2m']
        sizeH: 256
        sizeW: 256
        filename_format: _sample{index}
        file_size: 1
        var_indices: [0,1,2,3] #where to find the variables in dataset samples
        crop_indices: [0,256,0,256]
        preprocessor_config:
          type: Preprocessor
          real_var_indices: [0,1,2,3] #where to find the variables in stat files
          real_data_dir: /project/home/p200177/DE_371/datasets/dataset_Meteo_France_rr_u_v_t2m/data/IS_rr_debug_1_1.0_0_0_0_0_0_256_large_lt
          stat_folder: "stat_files/"
          stat_version: "rr" # the name of the stat file is for ex: 'mean_[stat_version]_log_ppx.npy'
          rr_transform:
            log_transform_iteration: 1
            symetrization: False
            gaussian_std: 0 # Threshold between rain and no rain to add a gaussian noise where rr < gaussian_std.
          normalization:
            type: "minmax"
            per_pixel: False
            for_rr:
              blur_iteration: 1

      fake_dataset_config:
        type: FakeDataset
        data_folder:  /project/scratch/p200177/DE_371/angeliquebonamy/results/dates/GOOD_DATA/amse/
        variables: ['rr','u','v','t2m']
        sizeH: 256
        sizeW: 256
        filename_format: packRsemble_{date}_{formatted_index}
        file_size: 16
        var_indices: [0,1,2,3] #where to find the variables in dataset samples
        crop_indices: [0,256,0,256]
        preprocessor_config:
          type: ReverserrPreprocessor
          real_var_indices: [0,1,2,3] #where to find the variables in stat files
          real_data_dir: /project/home/p200177/DE_371/datasets/dataset_Meteo_France_rr_u_v_t2m/data/IS_rr_debug_1_1.0_0_0_0_0_0_256_large_lt
          stat_folder: "stat_files/"
          stat_version: "rr" # the name of the stat file is for ex: 'mean_[stat_version]_log_ppx.npy'
          rr_transform:
            log_transform_iteration: 1
            symetrization: False
            gaussian_std: 0
          normalization:
            type: "minmax"
            per_pixel: False
            for_rr:
              blur_iteration: 1
      obs_dataset_config:
        data_folder: /project/home/p200177/DE_371/datasets/dataset_Meteo_France_rr_u_v_t2m/obs_databases
        crop_indices: [180, 436, 500, 756]
        variables: ['rr1','ff','dd','t2m']
        var_indices: [0,1,2,3]
        preprocessor_config:
            type: Preprocessor
    metrics:
      args:
        debiasing: False
        debiasing_mode: ENSAVG
        conditioning_members: 16
        threshold: [[ 1.39, 2.78, 4.17, 5.56, 8.33, 11.11 ], [ 278.15, 283.15, 288.15, 293.15, 297.15, 303.15 ]] ## [ff], [t2m] 
        var_channel: 1
        obs_var_channel: 1
        isOnReal: False
        lon_min: 540
        lat_min: 120
        sizeH: 256
        sizeW: 256
      metrics_list:
        # - name: ObjectsAttribution
        #   type: ObjectsAttribution
        # - name: AreaProportion
        #   rr_idx: 0
        #   type: AreaProportion
        # - name: spectralCompute
        #   type: spectralCompute
        # - name: spectralDist
        #   type: spectralDist

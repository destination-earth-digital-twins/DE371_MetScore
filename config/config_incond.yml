output_folder: /home/users/u101957/DE371_MetScore/test_incond_final/
experiments:
  - name: AROME # the name is a unique identifier to each experiment
    dataloaders:
      type: RandomDataloader
      batch_size: 1
      maxNsamples: 16384
      path_to_csv: /project/home/p200177/DE_371/datasets/dataset_Meteo_France_rr_u_v_t2m/data/IS_rr_debug_1_1.0_0_0_0_0_0_256_large_lt
      csv_file: IS_boostrap_no_duplicate_rr_cumul_correct_train.csv
      real_dataset_config:
        data_folder: /project/home/p200177/DE_371/datasets/dataset_Meteo_France_rr_u_v_t2m/data/IS_rr_debug_1_1.0_0_0_0_0_0_256_large_lt
        variables: ['rr','u','v','t2m']
        sizeH: 256
        sizeW: 256
        filename_format: _sample{index}
        file_size: 1
        var_indices: [0,1,2,3] #where to find the variables in dataset samples
        crop_indices: [0,256,0,256]
        preprocessor_config:
          type: Preprocessor
          real_var_indices: [0,1,2,3] #where to find the variables in stat files
          real_data_dir: /project/home/p200177/DE_371/datasets/dataset_Meteo_France_rr_u_v_t2m/data/IS_rr_debug_1_1.0_0_0_0_0_0_256_large_lt
          stat_folder: "stat_files_Massif_Central/"
          stat_version: "rr" # the name of the stat file is for ex: 'mean_[stat_version]_log_ppx.npy'
          rr_transform:
            log_transform_iteration: 1
            symetrization: False
            gaussian_std: 0 # Threshold between rain and no rain to add a gaussian noise where rr < gaussian_std.
          normalization:
            type: "minmax"
            per_pixel: False
            for_rr:
              blur_iteration: 1
      fake_dataset_config:
        type: RandomDataset
        data_folder: /project/home/p200177/DE_371/datasets/dataset_Meteo_France_rr_u_v_t2m/data/IS_rr_debug_1_1.0_0_0_0_0_0_256_large_lt
        variables: ['rr','u','v','t2m']
        sizeH: 256
        sizeW: 256
        filename_format: _sample{index}
        file_size: 1
        var_indices: [0,1,2,3] #where to find the variables in dataset samples
        crop_indices: [0,256,0,256]
        preprocessor_config:
          type: Preprocessor
          nb_timesteps: 15
          timestep_period: 3
          stack_sample_along_time_and_variable: True
          real_var_indices: [0,1,2,3] #where to find the variables in stat files
          real_data_dir: /project/home/p200177/DE_371/datasets/dataset_Meteo_France_rr_u_v_t2m/data/IS_rr_debug_1_1.0_0_0_0_0_0_256_large_lt
          stat_folder: "stat_files_Massif_Central/"
          stat_version: "rr" # the name of the stat file is for ex: 'mean_[stat_version]_log_ppx.npy'
          rr_transform:
            log_transform_iteration: 1
            symetrization: False
            gaussian_std: 0
          normalization:
            type: "minmax"
            per_pixel: False
            for_rr:
              blur_iteration: 1
      obs_dataset_config:
        data_folder: /project/home/p200177/DE_371/datasets/dataset_Meteo_France/obs_databases/
        crop_indices: [180, 436, 500, 756]
        variables: ['ff','dd','t2m']
        var_indices: [0,1,2,3]
        preprocessor_config:
            type: Preprocessor
    metrics:
      args:
        debiasing: False
        debiasing_mode: ENSAVG
        conditioning_members: 16
        threshold: [[ 1.39, 2.78, 4.17, 5.56, 8.33, 11.11 ], [ 278.15, 283.15, 288.15, 293.15, 297.15, 303.15 ]] ## [ff], [t2m] 
        var_channel: 1
        obs_var_channel: 1
        isOnReal: False
        lon_min: 540
        lat_min: 120
        sizeH: 256
        sizeW: 256
      metrics_list:
        - name: SWD
          type: SWDall
        # - name: MultivarCorr
        #   type: MultivarCorr
        - name: spectralCompute
          type: spectralCompute
        # - name: rankHistogram
        #   type: rankHistogram
        # - name: ObjectsAttribution
        #   type: ObjectsAttribution
        - name: AreaProportion
          rr_idx: 0
          type: AreaProportion
        # - name: Quantiles
        #   type: Quantiles
        #   qlist: [0.05,0.5,0.8,0.9]
        # - name: QuantilesScore
        #   type: QuantilesScore
        #   qlist: [0.01,0.1,0.9,0.99]

